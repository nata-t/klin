# A production-like stack on one machine:
#   docker compose -f docker-compose.prod.yml up --build
# then open http://localhost:8080. Reads secrets from .env.
name: klin-app-prod

services:
  # klin:if postgres
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klin_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-klin_app}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  # klin:endif
  # klin:if mysql

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-klin_app}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
  # klin:endif
  # klin:if queues

  redis:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
  # klin:endif

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      API_PORT: 3000
      WEB_URL: ${PUBLIC_URL:-http://localhost:8080}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
      # klin:if postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-klin_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-klin_app}?schema=public
      # klin:elif mysql
      #? DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-klin_app}
      # klin:elif sqlite
      #? DATABASE_URL: file:./packages/db/data/app.db
      # klin:endif
      # klin:if queues
      REDIS_URL: redis://redis:6379
      # klin:endif
    # klin:if sqlite
    volumes:
      - sqlite-data:/app/packages/db/data
    # klin:endif
    # klin:if postgres || mysql || queues
    depends_on:
      # klin:if postgres
      postgres:
        condition: service_healthy
      # klin:elif mysql
      mysql:
        condition: service_healthy
      # klin:endif
      # klin:if queues
      redis:
        condition: service_started
      # klin:endif
    # klin:endif

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # klin:if next
      #? args:
      #?   API_URL: http://api:3000
      # klin:endif
    restart: unless-stopped
    environment:
      # klin:if next
      #? API_URL: http://api:3000
      # klin:else
      API_UPSTREAM: http://api:3000
    ports:
      - "8080:80"
      # klin:endif
    depends_on:
      - api
  # klin:if next

  # nginx in front of Next.js: records each visitor's address for the API's
  # rate limits and logs, and sends /api straight to the API.
  proxy:
    image: nginx:1-alpine
    restart: unless-stopped
    environment:
      WEB_UPSTREAM: http://web:3000
      API_UPSTREAM: http://api:3000
    volumes:
      - ./apps/web/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8080:80"
    depends_on:
      - web
  # klin:endif

volumes:
  # klin:if postgres
  postgres-data:
  # klin:elif mysql
  mysql-data:
  # klin:elif sqlite
  sqlite-data:
  # klin:endif
  # klin:if queues
  redis-data:
  # klin:endif
